packages: []
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
overrides:
  '@gatopago/shared@3.2.3': file:vendor/gatopago-shared-3.2.3.tgz
  # typescript-eslint 8.67.0 supports TypeScript <6.1; keep optional peer
  # resolution aligned with the workspace compiler until that range advances.
  typescript: 6.0.3
  'ws@<8.21.0': '>=8.21.0'
  'esbuild@>=0.18.0 <0.28.1': '>=0.28.1'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'postcss@<8.5.23': '>=8.5.23'
  'nanoid@<3.3.18': '>=3.3.18'
  # @peculiar 2.9.x dropped trusted-publisher provenance. SimpleWebAuthn's
  # ranges also support the last provenance-preserving release, so keep the
  # ASN.1 parsers pinned until the publisher restores equivalent trust.
  '@peculiar/asn1-android': '2.8.0'
  '@peculiar/asn1-cms': '2.8.0'
  '@peculiar/asn1-csr': '2.8.0'
  '@peculiar/asn1-ecc': '2.8.0'
  '@peculiar/asn1-pfx': '2.8.0'
  '@peculiar/asn1-pkcs8': '2.8.0'
  '@peculiar/asn1-pkcs9': '2.8.0'
  '@peculiar/asn1-rsa': '2.8.0'
  '@peculiar/asn1-schema': '2.8.0'
  '@peculiar/asn1-x509': '2.8.0'
  '@peculiar/asn1-x509-attr': '2.8.0'
allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
